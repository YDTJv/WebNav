<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>油气工业物联网系统</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
    <link href="static/css/stytle.css" rel="stylesheet">
    <link rel="icon" href="static/image/vivian.ico" type="image/x-icon">
    <link rel="shortcut icon" href="static/image/vivian.ico" type="image/x-icon">
    <style>
        :root {
            --primary: #3498db;
            --primary-dark: #2980b9;
            --card-bg: rgba(255, 255, 255, 0.1);
            --input-bg: rgba(255, 255, 255, 0.1);
            --text-light: #fff;
            --success: #4CAF50;
            --error: #f44336;
        }
    </style>
</head>

<body>
    <canvas id="canvas"></canvas>
    <div class="container">
        <header class="header">
            <h1 class="title">油气工业物联网系统</h1>
            <p class="subtitle">同态加密数据传输与聚合</p>
        </header>

        <a href="login.html" class="enter-system">
            <i class="fas fa-sign-in-alt"></i>
            进入系统
        </a>

        <div class="features">
            <div class="feature">
                <div class="feature-icon">
                    <i class="fas fa-shield-alt"></i>
                </div>

                <p class="feature-desc">采用同态加密技术，确保数据传输安全</p>
            </div>

            <div class="feature">
                <div class="feature-icon">
                    <i class="fas fa-chart-line"></i>
                </div>
                <h2 class="feature-title">实时监控</h2>
                <p class="feature-desc">实时监控 RTU 设备状态和数据传输</p>
            </div>

            <div class="feature">
                <div class="feature-icon">
                    <i class="fas fa-database"></i>
                </div>
                <h2 class="feature-title">数据聚合</h2>
                <p class="feature-desc">支持加密数据的聚合计算</p>
            </div>
        </div>
    </div>
    <script src="static/js/starsky.js"></script>
    <script src="static/js/server-config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
