<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="static/css/login.css">
    <link rel="icon" href="static/image/vivian.ico" type="image/x-icon">
    <title>登录系统</title>
</head>

<body>
    <canvas id="canvas"></canvas>
    <div class="container">
        <div class="login-container">
            <h2 class="text-3xl font-bold mb-6 text-center page-title">登录</h2>
            <form id="loginForm">
                <div class="mb-4">
                    <label for="username" class="block text-white text-sm font-bold mb-2">用户名</label>
                    <input type="text" id="username" class="w-full py-2 px-3 rounded focus:outline-none focus:shadow-outline" placeholder="请输入用户名">
                </div>
                <div class="mb-4">
                    <label for="password" class="block text-white text-sm font-bold mb-2">密码</label>
                    <input type="password" id="password" class="w-full py-2 px-3 rounded focus:outline-none focus:shadow-outline" placeholder="请输入密码">
                </div>
                <div class="mb-6">
                    <label for="userType" class="block text-white text-sm font-bold mb-2">用户类型</label>
                    <select id="userType" class="w-full py-2 px-3 rounded focus:outline-none focus:shadow-outline">
                        <option value="sender">Sender</option>
                        <option value="receiver">Receiver</option>
                    </select>
                </div>
                <div class="flex items-center justify-between">
                    <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">
                        登录
                    </button>
                    <a href="register.html" class="hover:text-blue-400">注册账号</a>
                </div>
            </form>
            <div id="errorMessage" class="text-red-500 text-center mt-4 hidden"></div>
        </div>
    </div>
    <script src="static/js/starsky.js"></script>
    <script src="static/js/login.js"></script>
</body>

</html>
